[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zakkend-nederland"
version = "0.1.0"
description = "ML-powered foundation subsidence risk assessment for Dutch homes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Prakhar Prakarsh", email = "prakhar@example.com" },
]
keywords = ["machine-learning", "geospatial", "netherlands", "subsidence", "xgboost", "shap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "shap>=0.44",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pyarrow>=15.0",
    "joblib>=1.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "black>=24.0",
    "ruff>=0.3",
    "mypy>=1.9",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/prakharprakarsh/zakkend-nederland"
Repository = "https://github.com/prakharprakarsh/zakkend-nederland"
Issues = "https://github.com/prakharprakarsh/zakkend-nederland/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"zakkend.api" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
